<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Pesquisa</title>
</head>

<body>

    <h1>Pesquisa de Satisfação</h1>

    <form action="">

        <label for="nome">Nome:</label>
        <br>
        <input type="text" id="nome" name="nome" required>
        <br><br>

        <label for="email">E-mail:</label>
        <br>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="telefone">Telefone:</label>
        <br>
        <input type="tel" id="telefone" name="telefone" required>
        <br><br>

        <label>Avaliação:</label>
        <br>
        <input type="radio" name="avaliacao"> Ótimo
        <input type="radio" name="avaliacao"> Bom
        <input type="radio" name="avaliacao"> Regular
        <input type="radio" name="avaliacao"> Ruim

        <br><br>

        <label>Serviços:</label>
        <br>
        <input type="checkbox"> Atendimento
        <input type="checkbox"> Suporte
        <input type="checkbox"> Treinamento
        <input type="checkbox"> Consultoria

        <br><br>

        <label for="unidade">Unidade:</label>
        <br>
        <select id="unidade" name="unidade">
            <option>Americana</option>
            <option>Campinas</option>
            <option>Santa Bárbara d'Oeste</option>
        </select>

        <br><br>

        <button type="submit">Enviar</button>

    </form>

</body>

</html>
